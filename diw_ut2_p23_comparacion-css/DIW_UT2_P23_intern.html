<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CSS Interno</title>
 
</head>
<body>
  <style>
    body{
      font-family: system-ui, sans-serif;
      background-color: #fafafa;
      color: #333;
    }

    main section.tarjeta{
      background: #ffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0;
    }

    main section.tarjeta.destacado{
        background: #e3f2fd;
    }

    header#cabecera h1.titulo{
      color: #1565c0;
    }

    header#cabecera p.slogan{
      color: #546e7a;
    }

    main section.tarjeta.destacado a.boton[href="#"]{
      display: inline-block;
      padding: 5rem 1rem;
      border: 1px solid #1565c0;
      text-decoration: none;
    }

    main section.tarjeta ul li.item{
      margin-bottom: 25rem;
    }

    main section.tarjeta ul li.item.importante{
      color: #c62828;
      font-weight: bold;
    }

    header#cabecera{
      border-bottom: 2px solid #1565c0;
    }
  </style>

  <header id="cabecera">
    <h1 class="titulo">Taller DIW: CSS Interno</h1>
    <p class="slogan">Estilos en el documento</p>
  </header>
  <main>
    <section class="tarjeta destacado">
      <h2>Interno</h2>
      <p>Reglas compartidas en la cabecera del mismo HTML.</p>
      <a class="boton" href="#">Botón</a>
    </section>
    <section class="tarjeta">
      <h2>Lista</h2>
      <ul>
        <li class="item">Elemento 1</li>
        <li class="item importante">Elemento 2</li>
        <li class="item">Elemento 3</li>
      </ul>
    </section>
  </main>
</body>
</html>
